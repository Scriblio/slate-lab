# Desktop packaging. `npm run dist:win` builds the Windows installer
# (desktop + Start menu shortcuts); `npm run dist:store` builds the package
# you upload to the Microsoft Store. See STORE.md.

appId: com.scriblio.encore
productName: Encore Karaoke
copyright: Copyright © 2026 Scriblio

directories:
  output: release
  buildResources: build

# The main process is bundled by scripts/build-desktop.mjs, so the app
# ships without node_modules.
files:
  - dist/**/*
  - dist-desktop/**/*
  - package.json
  - "!node_modules/**/*"

win:
  icon: build/icon.png
  target: [nsis]

nsis:
  artifactName: Encore-Karaoke-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Encore Karaoke
  runAfterFinish: true
  deleteAppDataOnUninstall: false

appx:
  artifactName: Encore-Karaoke-${version}.${ext}
  # From Partner Center → Encore Karaoke Host (Store ID 9N6MQFM19C44) →
  # Product management → Product identity. Reserved 2026-11-27 under the
  # ALM Partners LLC company account. "Encore Karaoke" was already taken,
  # and the Store requires displayName to match a reserved name.
  identityName: ALMPartnersLLC.EncoreKaraokeHost
  publisher: CN=9DC187E4-94AD-408D-872D-4752131B82EC
  publisherDisplayName: ALM Partners LLC
  applicationId: EncoreKaraoke
  displayName: Encore Karaoke Host
  backgroundColor: "#07070c"
  languages: [en-US]
  # Phones on the venue Wi-Fi connect to the app to join the list.
  capabilities:
    - internetClient
    - internetClientServer
    - privateNetworkClientServer

mac:
  category: public.app-category.music
  target: [dmg]

linux:
  category: AudioVideo
  target: [AppImage]

# Updates are delivered by the Store (or a new installer), not auto-update.
publish: null

# The Store package asks Microsoft for no restricted capability but the runFullTrust that electron-builder
# adds for any desktop app. Windows redirects a Store app's writes to AppData, so the Store build keeps
# its data in the user's profile instead (src/desktop/datadir.ts, STORE.md "The data folder").
